[package]
name = "disc2mp4"
version = "0.1.0"
edition = "2021"
description = "Convert home-made DVD/Blu-ray folders to mp4 with ffmpeg"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
